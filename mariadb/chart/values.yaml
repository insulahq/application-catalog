replicaCount: 1

image:
  repository: mariadb
  tag: "12.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306

resources:
  requests:
    cpu: 0.25
    memory: 256Mi
  limits:
    cpu: 0.25
    memory: 256Mi

persistence:
  enabled: true
  mountPath: "/var/lib/mysql"
  size: 5Gi

auth:
  rootPassword: ""
  database: ""
  username: ""
  password: ""

# Low-footprint server tuning. Mirrors `components[].args` in manifest.json —
# the manifest is what the platform deploys; keep the two in step.
# The InnoDB buffer pool is deliberately left at its 128M default: shrinking it
# costs far more in IO than it saves in RAM.
serverArgs:
  - --key-buffer-size=8M
  - --aria-pagecache-buffer-size=16M
  - --innodb-log-buffer-size=8M
  - --max-connections=60
  - --thread-cache-size=8
  - --back-log=30
  - --innodb-purge-threads=1
  - --table-open-cache=400
  - --table-definition-cache=400
  - --sort-buffer-size=512K
  - --join-buffer-size=256K
  - --read-buffer-size=128K
  - --read-rnd-buffer-size=256K
  - --tmp-table-size=8M
  - --max-heap-table-size=8M
