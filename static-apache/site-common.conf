# Insula platform — directives shared by every generated multi-host site.
#
# Included from inside each <VirtualHost> the platform writes into
# conf/insula/sites.d. Everything here is DOCUMENT-ROOT INDEPENDENT so a
# generated site is only ServerName / DocumentRoot plus this include.
#
# RemoteIP and the log format are NOT repeated: they are set once in the main
# server config and virtual hosts inherit them, so restating them here would
# create two copies that can drift.

# Filesystem policy for every site root in this container. Scoped to /var/www
# rather than to one docroot so a single block covers them all. Deliberately
# mirrors the stock <Directory> in httpd.conf — including `Indexes` — so a
# multi-host site and the catch-all behave the same way; a site that silently
# stopped listing directories when it moved onto a shared pod would be a
# regression nobody asked for.
<Directory "/var/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted

    # --- Scheme-aware directory redirect (platform reverse proxy) ---
    # TLS terminates at Traefik, so mod_dir's trailing-slash 301 (/work ->
    # /work/) would hardcode scheme http (the pod connection). Issue the
    # redirect ourselves so it honours the edge scheme from X-Forwarded-Proto.
    # (mod_headers cannot fix mod_dir's Location — it lives in headers_out,
    # which `Header always` does not touch.) In <Directory> context so
    # REQUEST_FILENAME resolves for the -d test.
    DirectorySlash Off
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L,QSA]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ %{REQUEST_URI}/ [R=301,L,QSA]
</Directory>
