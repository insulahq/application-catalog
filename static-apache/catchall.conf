# Insula platform — the catch-all virtual host.
#
# This file exists because of an Apache rule that is easy to miss: while a
# server has NO <VirtualHost> blocks, the main server config answers every
# request; the moment ONE is defined, the main server config stops serving that
# address and the FIRST virtual host becomes the default instead.
#
# So generating per-site vhosts would silently hand every unmatched hostname to
# whichever site happened to sort first. This block is included BEFORE
# sites.d/*.conf, which makes it that default and preserves exactly the previous
# behaviour: an unmatched hostname is served from the stock document root.
#
# It is intentionally almost empty — DocumentRoot is the only thing a virtual
# host does not inherit from the main server config.
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"
</VirtualHost>
