# Insula platform — multi-host site includes.
#
# a2ensite'd at build time as `zz-insula-sites.conf`, which sorts AFTER the
# `ssl-<mode>.conf` the serversideup entrypoint links in. That ordering is
# load-bearing: Apache treats the FIRST <VirtualHost> for an address as the
# default (catch-all), so the stock single-site vhost keeps answering any
# hostname that matches no generated site.
#
# The directory is empty in the image. The platform mounts a ConfigMap over it
# holding one .conf per ingress route when a deployment has multi-host enabled;
# IncludeOptional makes the un-mounted case a no-op, so an image with no
# multi-host configuration behaves exactly as it did before this file existed.
IncludeOptional /etc/apache2/insula/sites.d/*.conf
