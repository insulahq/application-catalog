# Insula platform overrides — included at the END of the upstream
# serversideup vhost template, inside the <VirtualHost> block.

# --- Real client IP recovery (platform reverse proxy) ---
# Behind the platform's Traefik ingress the workload's TCP peer is a Traefik
# POD IP in the k3s pod CIDR (10.42.0.0/16, within 10.0.0.0/8), NOT the
# visitor. The upstream template sets RemoteIPHeader to CF-Connecting-IP,
# which no request carries here — so without this, PHP would see
# $_SERVER['REMOTE_ADDR'] = 10.42.x.x. Ours is evaluated last and wins.
#
# Operators fronting the cluster with an external L4/L7 load balancer should
# add that LB's CIDR as an extra RemoteIPTrustedProxy line.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16
RemoteIPTrustedProxy fd00::/8

# --- Tell PHP the scheme the VISITOR used (platform reverse proxy) ---
# TLS terminates at Traefik, which forwards plain HTTP to this pod with
# `X-Forwarded-Proto: https`. Apache does not translate that on its own, so
# without these two lines PHP sees:
#     $_SERVER['HTTPS']           unset
#     $_SERVER['SERVER_PORT']     80
#     $_SERVER['REQUEST_SCHEME']  http
# Every framework that auto-detects its scheme (CodeIgniter, Laravel,
# WordPress, Symfony) therefore concludes "http" and emits http:// URLs on a
# site served over https. Measured on a live tenant 2026-08-31: a Perfex
# install performed over HTTPS wrote `http://<host>/` into its own config, so
# the login page loaded its CSS over http (blocked as mixed content) and the
# login form POSTed to http:// — the 301 to https turned that POST into a GET
# and silently discarded the credentials.
#
# This is deliberately separate from the RewriteCond below: that fixes the
# redirect mod_dir emits, which is a symptom. This fixes what the application
# itself believes, which is the cause.
#
# No trust configuration is involved — SetEnvIf reads the header as presented.
# The header is set by Traefik, which is the only thing that can reach this
# port (NetworkPolicy), and Traefik itself only honours X-Forwarded-* from the
# operator-configured trusted upstreams.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
# Some clients/proxies send only the port. Harmless when both are present.
SetEnvIf X-Forwarded-Port "^443$" HTTPS=on

# --- Scheme-aware directory redirect (platform reverse proxy) ---
# TLS terminates at Traefik, so mod_dir's directory trailing-slash 301
# (/docs -> /docs/) would hardcode scheme http (the pod connection). Issue the
# redirect ourselves so it honors the edge scheme from X-Forwarded-Proto.
# (mod_headers can't fix mod_dir's Location — it lives in headers_out, which
# `Header always` doesn't touch.) Done in <Directory> context so
# REQUEST_FILENAME resolves for the -d test; only real directories are
# affected, so PHP front-controller routes (non-existent paths) are untouched.
<Directory "${APACHE_DOCUMENT_ROOT}">
    Options +FollowSymLinks
    DirectorySlash Off
    RewriteEngine On
    # Real directory, no trailing slash, arrived via the TLS edge -> https.
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L,QSA]
    # Same, but plain http for direct (non-proxied) access.
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ %{REQUEST_URI}/ [R=301,L,QSA]
</Directory>
