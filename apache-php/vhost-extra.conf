# Insula platform overrides — included at the END of the upstream
# serversideup vhost template, inside the stock <VirtualHost> block.
#
# The directives themselves live in site-common.conf because the per-site
# vhosts the platform generates for multi-host deployments need exactly the
# same set. Keeping one copy is what stops the stock vhost and a generated
# vhost from drifting into different real-IP or scheme behaviour.
Include /etc/apache2/insula/site-common.conf
