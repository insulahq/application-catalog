# Insula platform — directives shared by every generated multi-host site.
#
# Included from inside each `server { }` block the platform writes into
# /etc/nginx/insula/sites.d. Everything here is DOCUMENT-ROOT INDEPENDENT, so a
# generated site is only `server_name` + `root` + this include.
#
# `listen` lives HERE rather than in the generated file on purpose: nginx
# matches `server_name` only among blocks listening on the SAME address, so a
# site that listened on one family while the stock server listened on both
# would be unreachable over the other — a half-working site that looks like a
# DNS fault. The image owns its own sockets; the platform owns the names.
listen 8080;
listen [::]:8080;

# --- Real client IP recovery (platform reverse proxy) ---
# Behind the platform's Traefik ingress the workload's TCP peer is a Traefik
# POD IP in the k3s pod CIDR (10.42.0.0/16, within 10.0.0.0/8), NOT the
# visitor. Same trust list as the stock server in nginx.default.conf — keep the
# two in step, or a site and the catch-all disagree about who the client is.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fd00::/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Relative redirects (platform reverse proxy) ---
# TLS terminates at Traefik and this server listens on :8080, so nginx's own
# scheme/port are http/8080 — not the client's https/443. With absolute
# redirects a directory trailing-slash 301 would send the browser to
# http://<host>:8080/..., the wrong scheme and an unexposed port.
absolute_redirect off;

index index.html index.htm;

# Refuse to follow symlinks out of the site.
#
# A static runtime has no interpreter and therefore no open_basedir; this
# directive is the ONLY confinement between a site and the rest of the tenant's
# volume, which the pod mounts in full at /var/www/sites. Without it a symlink
# inside a site folder — easily introduced by extracting a tarball containing
# one — serves a neighbouring site's files, or an app's data directory, to the
# internet.
#
# `from=$document_root` checks the path components BELOW the document root,
# which is exactly where such a symlink would sit, and avoids failing when a
# component of the mount path above it is itself a link. `if_not_owner` would
# be useless: every file on the volume has the same owner.
disable_symlinks on from=$document_root;

location / {
    try_files $uri $uri/ =404;
}

location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

client_max_body_size 10m;
