# Insula platform — multi-host site includes (http context).
#
# The platform mounts a ConfigMap over /etc/nginx/insula/sites.d holding one
# server block per ingress route when a deployment has multi-host enabled. A
# wildcard include matching no files is not an error in nginx, so an image with
# nothing mounted behaves exactly as it did before this file existed.
#
# Ordering is not load-bearing here the way it is for Apache: the stock server
# in nginx.default.conf declares `default_server` explicitly, so it stays the
# catch-all for hostnames that match no generated site regardless of the order
# conf.d files are read in.
include /etc/nginx/insula/sites.d/*.conf;
