name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JSON formatting
        run: npm run format:check

      - name: Validate manifests and charts
        run: npm run validate

      - name: Web images must resolve the real client IP
        # Without real-IP handling every visitor is logged as the platform's
        # Traefik pod address and PHP sees it as REMOTE_ADDR, so tenant
        # rate-limiting, geo-logic and abuse blocking see one client for the
        # whole internet. Also pins that a forged X-Forwarded-For prefix cannot
        # displace the true client, and that static-apache's access log is
        # actually formatted. Runs the shipped configs under real nginx/httpd/php-fpm.
        run: ./scripts/test-real-client-ip.sh

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint all charts
        run: |
          errors=0
          for chart in */chart; do
            entry=$(dirname "$chart")
            echo "=== helm lint $entry ==="
            if ! helm lint "$chart" --strict; then
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors chart(s) failed helm lint"
            exit 1
          fi
          echo "✅ All charts passed helm lint"
