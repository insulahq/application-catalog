# --- Tell PHP the scheme the VISITOR used (platform reverse proxy) ---
#
# Included from /etc/nginx/conf.d/, i.e. nginx's `http` context, so these maps
# are visible to every server and location.
#
# TLS terminates at Traefik, which forwards plain HTTP to this pod on :8080.
# nginx's own $https is therefore EMPTY, and the stock fastcgi_params line
#
#     fastcgi_param  HTTPS              $https if_not_empty;
#
# never sends the parameter at all. Measured on a live pod 2026-08-31, sending
# exactly the headers Traefik sends:
#
#     X-Forwarded-Proto: https  ->  HTTPS "(unset)"  REQUEST_SCHEME "http"
#                                   SERVER_PORT "8080"
#
# So PHP believes it is serving plain HTTP on port 8080 while the visitor is on
# HTTPS. Every framework that auto-detects its scheme (WordPress, Laravel,
# CodeIgniter, Symfony) then emits http:// URLs on an https:// site: assets are
# blocked as mixed content, and a login form POSTing to http:// gets a 301,
# which turns the POST into a GET and silently discards the credentials.
#
# This is the nginx counterpart of apache-php/vhost-extra.conf's
# `SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on`.
#
# WHY THIS FIXES MORE THAN apache-php DOES. nginx builds the FastCGI parameter
# set from configuration, so REQUEST_SCHEME and SERVER_PORT are ours to set.
# Apache does not: httpd core derives both from the real connection and
# overwrites anything SetEnvIf puts in subprocess_env. Verified 2026-08-31 by
# adding `SetEnvIf X-Forwarded-Proto "^https$" REQUEST_SCHEME=https` to a
# running apache-php container — config test OK, graceful reload, and PHP still
# reported REQUEST_SCHEME "http" / SERVER_PORT "8080". So apache-php tops out at
# HTTPS=on (which is the signal WordPress and friends actually check) while
# nginx-php can report all three. The asymmetry is a limit of httpd, not an
# oversight — do not "fix" apache-php by copying the three maps below.
#
# `default` falls back to nginx's own value in every map, so this is a no-op
# when nginx terminates TLS itself (SSL_MODE=on) or when no proxy header is
# present — verified: without the header the probe still reports
# HTTPS "(unset)", REQUEST_SCHEME "http", SERVER_PORT "8080".
#
# No trust configuration is involved — a map reads the header as presented. The
# header is set by Traefik, which is the only thing that can reach this port
# (NetworkPolicy), and Traefik itself only honours X-Forwarded-* from the
# operator-configured trusted upstreams. This mirrors the trust model already
# used by server-opts.d/remoteip.conf for X-Forwarded-For.

map $http_x_forwarded_proto $insula_https {
    default  $https;
    https    on;
}

map $http_x_forwarded_proto $insula_scheme {
    default  $scheme;
    https    https;
    http     http;
}

map $http_x_forwarded_port $insula_server_port {
    default  $server_port;
    443      443;
    80       80;
}
